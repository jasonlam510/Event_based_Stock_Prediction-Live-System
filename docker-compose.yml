version: '3.8'

services:
  app:
    build: .
    container_name: myfyp_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:I_Love_CityU@postgres:5432/myfypdb
    volumes:
      - .:/app
    networks:
      - myfyp_network

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: myfyp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: I_Love_CityU
      POSTGRES_DB: myfypdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myfypdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myfyp_network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: myfyp_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=I_Love_CityU
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,marcusolsson-dynamictext-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - postgres
    networks:
      - myfyp_network

volumes:
  postgres_data:
    name: myfyp_postgres_data
  grafana_data:
    name: myfyp_grafana_data

networks:
  myfyp_network:
    name: myfyp_network 